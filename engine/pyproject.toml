[project]
name = "charengine"
version = "0.1.0"
description = "Photo-to-3D character pipeline: preprocess -> reconstruct -> mesh -> texture -> GLB."
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pillow>=10",
    "trimesh>=4.4",
    "pymcubes>=0.1.6",
    "xatlas>=0.0.9",
    "fast-simplification>=0.1.7",
    "scipy>=1.11",
    "rembg>=2.0.57",
    "onnxruntime>=1.17",
    "transformers>=4.40,<5",
    "huggingface-hub>=0.23",
    "omegaconf>=2.3",
    "einops>=0.7",
    "pygltflib>=1.16",
]

[project.scripts]
charengine = "charengine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["charengine"]

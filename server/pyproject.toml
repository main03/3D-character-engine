[project]
name = "charengine-server"
version = "0.1.0"
description = "FastAPI service exposing charengine as an async job API."
requires-python = ">=3.11,<3.13"
dependencies = [
    "charengine",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
charengine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
